name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install from a clean checkout
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -m "not slow"
      - name: Demo step and checkpoint smoke
        run: |
          python - << 'PY'
          from aRieL import ArielEnv, make_demo_targets
          from aRieL.agents import (
              RLAgentWrapper,
              load_default_model,
              make_checkpoint_smoke_env,
          )

          env = ArielEnv.from_preset("demo", targets=make_demo_targets(8))
          obs, info = env.reset(seed=0)
          action = int(info["action_mask"].nonzero()[0][0])
          env.step(action)
          env.close()

          model = load_default_model()
          agent = RLAgentWrapper(model, deterministic=True)
          smoke = make_checkpoint_smoke_env()
          obs, info = smoke.reset(seed=42)
          action = agent.act(obs, info)
          assert bool(info["action_mask"][action])
          smoke.step(action)
          smoke.close()
          print("checkpoint smoke ok", type(model).__name__)
          PY
