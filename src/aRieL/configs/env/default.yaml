# Recommended starting env: top-K events, 3.5-year mission.
# Observation / reward fields fall back to dataclass defaults unless set here.

mission:
  start_bjd: 2462867.5
  lifetime_days: 1278.375
  cost_factor: 2.5
  overhead_days_per_obs: 0.0
  max_tier_cap: 3

slew:
  rate_deg_per_min: 1.0
  min_slew_seconds: 120.0
  max_slew_seconds: 7200.0

action:
  type: topk
  topk:
    k: 50
    sort_by: window_mid
    exclude_started_blocks: false

observation:
  include_population_bin_fractions: true
  min_bin_targets: 10
  normalise: true

seed: 42
